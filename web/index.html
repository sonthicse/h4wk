<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>h4wk</title>
    <script>
      // Áp theme trước khi vẽ để không nháy trắng; cùng logic với src/lib/theme.ts.
      try {
        var t = localStorage.getItem('h4wk-theme')
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        if (t === 'dark') {
          document.documentElement.classList.add('dark')
          document.querySelector('link[rel="icon"]').setAttribute('href', '/logo-dark.svg')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
