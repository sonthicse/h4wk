[project]
name = "h4wk"
version = "0.1.0"
description = "h4wk: SOCMINT YouTube demo"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "anthropic>=2.10.0",
    "openai>=3.55.1",
    "google-genai>=3.5.0",
    "python-dotenv>=1.2.4",
    "scenedetect-headless>=0.7.3,<0.8",
    "opencv-python-headless>=5.1.0.95",
    "numpy>=2.5.5",
    "sqlmodel>=0.0.22",
    "argon2-cffi>=23.1",
    "yt-dlp[curl-cffi,default]>=2026.10.26",
    "huey>=2.5",
]

[project.scripts]
h4wk = "h4wk.cli:main"

[project.optional-dependencies]
stt = [
    "av==16.1.0",
    "faster-whisper>=1.2.1",
]
match = [
    "torch==2.6.0",
    "torchvision==0.21.0",
    "transformers>=4.49,<5",
    # Wheel torch cu126 trên index PyTorch không khai báo thư viện CUDA cho x86_64; ghim như spike.
    "nvidia-cublas-cu12==12.6.4.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cuda-cupti-cu12==12.6.80; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cuda-nvrtc-cu12==12.6.77; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cuda-runtime-cu12==12.6.77; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cudnn-cu12==9.5.1.17; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cufft-cu12==11.3.0.4; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-curand-cu12==10.3.7.77; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cusolver-cu12==11.7.1.2; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cusparse-cu12==12.5.4.2; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cusparselt-cu12==0.6.3; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-nccl-cu12==2.25.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-nvjitlink-cu12==12.6.85; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-nvtx-cu12==12.6.77; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2>=2.16",
    "ruff>=0.6",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/h4wk"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: test gọi mạng/API thật, chạy tay bằng -m live",
    "gpu: kiểm thử trên GPU với model và bản thu T44",
]
addopts = "-m 'not live'"
