<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Collect</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400&amp;display=swap" rel="stylesheet">
<style>body{margin:0} a{color:#171717} a:hover{color:#525252}</style>
</helmet>
<div style="width: 1280px; height: 900px; display: flex; font-family: Geist, system-ui, sans-serif; font-size: 14px; color: #0a0a0a; background: #ffffff;">
  <dc-import name="Sidebar" active="Collect" h="{{h}}" hint-size="240px,900px"></dc-import>
  <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column;">
    <header style="height: 48px; flex-shrink: 0; border-bottom: 1px solid #e5e5e5; display: flex; align-items: center; gap: 10px; padding: 0 16px;">
      <button type="button" aria-label="Toggle sidebar" style="width: 32px; height: 32px; border: none; background: transparent;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#404040" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M9 3v18"></path></svg></button>
      <span aria-hidden="true" style="width: 1px; height: 16px; background: #e5e5e5;"></span>
      <span style="color: #404040;">thi</span>
    </header>
    <main style="padding: 24px; display: flex; flex-direction: column; gap: 20px;">
      <h1 style="margin: 0; font-size: 24px; font-weight: 600;">Collect</h1>
      <section style="border: 1px solid #e5e5e5; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 12px;">
        <h2 style="margin: 0; font-size: 16px; font-weight: 600;">New collection</h2>
        <div style="display: flex; gap: 12px; align-items: flex-end;">
          <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px;">
            <label for="collect-url" style="font-weight: 500;">Video, playlist or channel link</label>
            <input id="collect-url" placeholder="https://www.youtube.com/watch?v=…, a playlist link, or a channel link / @handle" style="height: 40px; border: 1px solid #d4d4d4; border-radius: 8px; padding: 0 12px; font: inherit;">
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px;">
            <label for="collect-level" style="font-weight: 500;">Level</label>
            <select id="collect-level" style="height: 40px; width: 120px; border: 1px solid #d4d4d4; border-radius: 8px; padding: 0 10px; font: inherit; background: #fff;"><option>full</option><option>text</option><option>metadata</option></select>
          </div>
          <button type="button" style="height: 40px; padding: 0 18px; border: none; border-radius: 8px; background: #171717; color: #fafafa; font: inherit; font-weight: 500;">Collect</button>
        </div>
        <label style="display: flex; align-items: center; gap: 8px; color: #737373;"><input type="checkbox"> Collect again even if this video was collected in the last 10 minutes</label>
      </section>

      <section style="display: flex; flex-direction: column; gap: 8px;">
        <h2 style="margin: 0; font-size: 18px; font-weight: 600;">Jobs</h2>
        <table style="width: 100%; border-collapse: collapse;">
          <thead>
            <tr style="text-align: left; color: #737373; border-bottom: 1px solid #e5e5e5;">
              <th scope="col" style="padding: 8px; font-weight: 500;">Input</th>
              <th scope="col" style="padding: 8px; font-weight: 500;">Level</th>
              <th scope="col" style="padding: 8px; font-weight: 500;">Status</th>
              <th scope="col" style="padding: 8px; font-weight: 500; width: 140px;">Progress</th>
              <th scope="col" style="padding: 8px; font-weight: 500;">Steps</th>
              <th scope="col" style="padding: 8px; font-weight: 500;">Started</th>
            </tr>
          </thead>
          <tbody>
            <sc-for list="{{jobs}}" as="j" hint-placeholder-count="5">
              <tr style="border-bottom: 1px solid #f0f0f0;">
                <td style="padding: 8px; font-family: 'Geist Mono', monospace; font-size: 13px;">{{j.input}}</td>
                <td style="padding: 8px;">{{j.level}}</td>
                <td style="padding: 8px;"><span style="{{j.badge}}">{{j.status}}</span></td>
                <td style="padding: 8px;"><span style="display: block; height: 6px; border-radius: 3px; background: #f0f0f0;"><span style="{{j.bar}}"></span></span></td>
                <td style="padding: 8px;">
                  <span style="display: flex; gap: 4px; flex-wrap: wrap;">
                    <sc-for list="{{j.steps}}" as="s" hint-placeholder-count="6">
                      <span style="{{s.style}}">{{s.name}}</span>
                    </sc-for>
                  </span>
                </td>
                <td style="padding: 8px; color: #737373; font-size: 13px;">{{j.at}}</td>
              </tr>
            </sc-for>
          </tbody>
        </table>
      </section>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const chip = (state) => 'font-size: 11px; border-radius: 6px; padding: 1px 6px; ' + (state === 'done' ? 'background: #f0f0f0; color: #404040;' : state === 'running' ? 'background: #171717; color: #fafafa;' : state === 'failed' ? 'background: #fee2e2; color: #991b1b;' : 'border: 1px dashed #d4d4d4; color: #737373;');
    const steps = (names, at, failed) => names.map((name, i) => ({ name, style: chip(i < at ? 'done' : i === at ? (failed ? 'failed' : 'running') : 'todo') }));
    const full = ['collect', 'transcribe', 'frames', 'ocr', 'match', 'analyze'];
    const text = ['collect', 'ocr', 'match', 'analyze'];
    const badge = (s) => 'font-size: 12px; border-radius: 6px; padding: 1px 7px; ' + (s === 'done' ? 'background: #171717; color: #fafafa;' : s === 'running' ? 'border: 1px solid #171717;' : s === 'failed' ? 'background: #dc2626; color: #fff;' : 'border: 1px solid #d4d4d4; color: #737373;');
    const bar = (p) => `display: block; width: ${p}%; height: 6px; border-radius: 3px; background: #171717;`;
    return {
      h: 900,
      jobs: [
        { input: 'd003oY3tOPs', level: 'full', status: 'running', badge: badge('running'), bar: bar(68), steps: steps(full, 4), at: '19:52 21/11/2026' },
        { input: '1RUJ_6eruwA', level: 'full', status: 'done', badge: badge('done'), bar: bar(100), steps: steps(full, 6), at: '18:01 21/11/2026' },
        { input: 'AiOTmCSFs4s', level: 'text', status: 'done', badge: badge('done'), bar: bar(100), steps: steps(text, 4), at: '17:10 21/11/2026' },
        { input: 'pFMt35QTTyQ', level: 'full', status: 'failed', badge: badge('failed'), bar: bar(20), steps: steps(full, 1, true), at: '16:44 21/11/2026' },
        { input: '@VTV24', level: 'full', status: 'queued', badge: badge('queued'), bar: bar(0), steps: steps(full, -1), at: '16:30 21/11/2026' },
      ],
    };
  }
}
</script>
</body>
</html>
