<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Watchlist</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400&amp;display=swap" rel="stylesheet">
<style>body{margin:0} a{color:#171717} a:hover{color:#525252}</style>
</helmet>
<div style="width: 1280px; height: 640px; display: flex; font-family: Geist, system-ui, sans-serif; font-size: 14px; color: #0a0a0a; background: #ffffff;">
  <dc-import name="Sidebar" active="Watchlist" h="{{h}}" hint-size="240px,640px"></dc-import>
  <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column;">
    <header style="height: 48px; flex-shrink: 0; border-bottom: 1px solid #e5e5e5; display: flex; align-items: center; gap: 10px; padding: 0 16px;">
      <button type="button" aria-label="Toggle sidebar" style="width: 32px; height: 32px; border: none; background: transparent;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#404040" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M9 3v18"></path></svg></button>
      <span aria-hidden="true" style="width: 1px; height: 16px; background: #e5e5e5;"></span>
      <span style="color: #404040;">thi</span>
    </header>
    <main style="padding: 24px; display: flex; flex-direction: column; gap: 16px;">
      <div style="display: flex; align-items: baseline; justify-content: space-between;">
        <h1 style="margin: 0; font-size: 24px; font-weight: 600;">Watchlist</h1>
        <span style="display: flex; gap: 6px; font-size: 12px;"><span style="border: 1px solid #d4d4d4; border-radius: 6px; padding: 1px 7px;">5 channels</span><span style="border: 1px solid #d4d4d4; border-radius: 6px; padding: 1px 7px;">[n] enabled</span></span>
      </div>
      <section style="border: 1px solid #e5e5e5; border-radius: 12px; padding: 16px; display: flex; gap: 12px; align-items: flex-end;">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px;"><label for="w-url" style="font-weight: 500;">Channel link or @handle</label><input id="w-url" placeholder="https://www.youtube.com/@handle or @handle" style="height: 40px; border: 1px solid #d4d4d4; border-radius: 8px; padding: 0 12px; font: inherit;"></div>
        <div style="display: flex; flex-direction: column; gap: 6px;"><label for="w-level" style="font-weight: 500;">Level</label><select id="w-level" style="height: 40px; width: 110px; border: 1px solid #d4d4d4; border-radius: 8px; padding: 0 10px; font: inherit; background: #fff;"><option>full</option></select></div>
        <button type="button" style="height: 40px; padding: 0 16px; border: none; border-radius: 8px; background: #171717; color: #fafafa; font: inherit; font-weight: 500;">Add channel</button>
      </section>
      <h2 style="margin: 0; font-size: 18px; font-weight: 600;">Channels</h2>
      <table style="width: 100%; border-collapse: collapse; font-size: 13px;">
        <thead>
          <tr style="text-align: left; color: #737373; border-bottom: 1px solid #e5e5e5;">
            <th scope="col" style="padding: 8px; font-weight: 500;">Channel</th>
            <th scope="col" style="padding: 8px; font-weight: 500;">Handle</th>
            <th scope="col" style="padding: 8px; font-weight: 500;">Watch</th>
            <th scope="col" style="padding: 8px; font-weight: 500;">Level</th>
            <th scope="col" style="padding: 8px; font-weight: 500;">Last checked</th>
            <th scope="col" style="padding: 8px; font-weight: 500; text-align: right;">Collected</th>
            <th scope="col" style="padding: 8px; font-weight: 500;"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Actions</span></th>
          </tr>
        </thead>
        <tbody>
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
            <tr style="border-bottom: 1px solid #f0f0f0;">
              <td style="padding: 9px 8px; font-weight: 500;">{{r.name}}</td>
              <td style="padding: 9px 8px; color: #737373;">{{r.handle}}</td>
              <td style="padding: 9px 8px;"><span aria-hidden="true" style="{{r.sw}}"><span style="{{r.knob}}"></span></span></td>
              <td style="padding: 9px 8px;">full</td>
              <td style="padding: 9px 8px; color: #737373;">{{r.checked}}</td>
              <td style="padding: 9px 8px; text-align: right; font-family: 'Geist Mono', monospace;">{{r.n}}</td>
              <td style="padding: 9px 8px;"><button type="button" style="height: 32px; padding: 0 10px; border: 1px solid #d4d4d4; border-radius: 6px; background: #fff; font: inherit;">Check now</button></td>
            </tr>
          </sc-for>
        </tbody>
      </table>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    const sw = (on) => `display: inline-flex; width: 34px; height: 20px; border-radius: 10px; padding: 2px; box-sizing: border-box; background: ${on ? '#171717' : '#d4d4d4'}; justify-content: ${on ? 'flex-end' : 'flex-start'};`;
    const knob = 'width: 16px; height: 16px; border-radius: 50%; background: #fff;';
    const r = (name, handle, on, checked, n) => ({ name, handle, sw: sw(on), knob, checked, n });
    return {
      h: 640,
      rows: [
        r('VTV24', '@VTV24', true, '2 min ago', '[n]'),
        r('Chân Trời Mới Media', '[handle]', true, '2 min ago', '[n]'),
        r('Việt Tân', '[handle]', true, '2 min ago', '[n]'),
        r('[channel]', '[handle]', false, '[time]', '[n]'),
        r('[channel]', '[handle]', true, '[time]', '[n]'),
      ],
    };
  }
}
</script>
</body>
</html>
