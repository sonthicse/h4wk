<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Videos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400&amp;display=swap" rel="stylesheet">
<style>body{margin:0} a{color:#171717} a:hover{color:#525252}</style>
</helmet>
<div style="width: 1280px; height: 760px; display: flex; font-family: Geist, system-ui, sans-serif; font-size: 14px; color: #0a0a0a; background: #ffffff;">
  <dc-import name="Sidebar" active="Videos" h="{{h}}" hint-size="240px,760px"></dc-import>
  <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column;">
    <header style="height: 48px; flex-shrink: 0; border-bottom: 1px solid #e5e5e5; display: flex; align-items: center; gap: 10px; padding: 0 16px;">
      <button type="button" aria-label="Toggle sidebar" style="width: 32px; height: 32px; border: none; background: transparent;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#404040" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M9 3v18"></path></svg></button>
      <span aria-hidden="true" style="width: 1px; height: 16px; background: #e5e5e5;"></span>
      <span style="color: #404040;">thi</span>
    </header>
    <main style="padding: 24px; display: flex; flex-direction: column; gap: 16px;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <h1 style="margin: 0; font-size: 24px; font-weight: 600;">Videos</h1>
        <label for="video-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Search videos</label>
        <input id="video-search" placeholder="Search title, channel or ID…" style="margin-left: auto; width: 320px; height: 40px; border: 1px solid #d4d4d4; border-radius: 8px; padding: 0 12px; font: inherit;">
        <a href="#" style="height: 40px; display: flex; align-items: center; padding: 0 16px; border-radius: 8px; background: #171717; color: #fafafa; text-decoration: none; font-weight: 500;">Collect a video</a>
      </div>
      <table style="width: 100%; border-collapse: collapse;">
        <thead>
          <tr style="text-align: left; color: #737373; border-bottom: 1px solid #e5e5e5;">
            <th scope="col" style="padding: 8px; font-weight: 500;">Title</th>
            <th scope="col" style="padding: 8px; font-weight: 500;">Channel</th>
            <th scope="col" style="padding: 8px; font-weight: 500;">Published</th>
            <th scope="col" style="padding: 8px; font-weight: 500; text-align: right;">Views</th>
            <th scope="col" style="padding: 8px; font-weight: 500;">Findings</th>
            <th scope="col" style="padding: 8px; font-weight: 500;">Latest capture</th>
          </tr>
        </thead>
        <tbody>
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
            <tr style="border-bottom: 1px solid #f0f0f0;">
              <td style="padding: 10px 8px; max-width: 380px;"><a href="#" style="text-decoration: none; font-weight: 500;">{{r.title}}</a></td>
              <td style="padding: 10px 8px; color: #404040;">{{r.channel}}</td>
              <td style="padding: 10px 8px; color: #737373;">{{r.date}}</td>
              <td style="padding: 10px 8px; text-align: right; font-family: 'Geist Mono', monospace;">{{r.views}}</td>
              <td style="padding: 10px 8px;"><span style="{{r.badge}}">{{r.findings}}</span></td>
              <td style="padding: 10px 8px; font-size: 13px; color: #404040;">{{r.capture}}</td>
            </tr>
          </sc-for>
        </tbody>
      </table>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    const red = 'font-size: 12px; background: #dc2626; color: #fff; border-radius: 6px; padding: 1px 7px;';
    const amber = 'font-size: 12px; background: #f59e0b; border-radius: 6px; padding: 1px 7px;';
    const none = 'font-size: 12px; border: 1px solid #d4d4d4; color: #737373; border-radius: 6px; padding: 1px 7px;';
    return {
      h: 760,
      rows: [
        { title: 'BẮT CÓC NGƯỜI, PHÁ NHÀ DÂN, CHÍNH QUYỀN TÔ LÂM MỚI LÀ KẺ KHỦNG BỐ', channel: 'Chân Trời Mới Media', date: '20/11/2026', views: '6', findings: '[n] · high', badge: red, capture: '13:20 20/11/2026' },
        { title: 'TỪ NGÀY TÔ LÂM LÊN NẮM QUYỀN, CÓ TỔNG CỘNG 850 NGHỊ ĐỊNH ĐƯỢC BAN HÀNH', channel: 'Chân Trời Mới Media', date: '19/11/2026', views: '52', findings: '[n] · medium', badge: amber, capture: '13:20 20/11/2026' },
        { title: 'T.ô L.âm ưu tiên quan hệ với Bắc Kinh hơn chủ quyền biển đảo', channel: 'Việt Tân', date: '20/11/2026', views: '83', findings: '[n] · medium', badge: amber, capture: '13:30 20/11/2026' },
        { title: 'T.ô L.âm dự Hội nghị Pháp Ngữ tại Campuchia giữa làn sóng chỉ trích', channel: 'Việt Tân', date: '18/11/2026', views: '799', findings: '[n] · medium', badge: amber, capture: '13:30 20/11/2026' },
        { title: 'Gian.g hồ mạng chử.i bới câu view... chính quyền cứ để đó', channel: 'Việt Tân', date: '20/11/2026', views: '385', findings: '[n] · medium', badge: amber, capture: '13:21 20/11/2026' },
        { title: 'GDP tăng 8% mà VN vẫn tụt hậu. #csvn', channel: 'Việt Tân', date: '19/11/2026', views: '774', findings: 'none', badge: none, capture: '13:21 20/11/2026' },
      ],
    };
  }
}
</script>
</body>
</html>
